[package]
name = "solverforge-cli"
version = "2.2.1"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/solverforge/solverforge-cli"
rust-version = "1.95"
description = "CLI for scaffolding and managing SolverForge constraint solver projects"

[[bin]]
name = "solverforge"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
clap_complete = "4.6.3"
dialoguer = "0.12"
include_dir = "0.7.4"
owo-colors = "4.3.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
strsim = "0.11.1"
quote = "1.0.45"
syn = { version = "2.0.117", features = ["full", "parsing", "visit"] }
toml = "1.1.2"
toml_edit = "0.25.11"

[dev-dependencies]
reqwest = { version = "0.13.3", features = ["blocking", "json", "rustls"] }
tempfile = "3.27.0"
