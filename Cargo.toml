[package]
name = "solverforge-cli"
version = "3.3.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/solverforge/solverforge-cli"
rust-version = "1.95"
description = "CLI for scaffolding and managing SolverForge constraint solver projects"

[[bin]]
name = "solverforge"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
clap_complete = "4.6.11"
dialoguer = "0.12"
include_dir = "0.7.4"
owo-colors = "4.4.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
strsim = "0.11.1"
quote = "1.0.47"
syn = { version = "3.0.6", features = ["full", "parsing", "visit"] }
toml = "1.1.6"
toml_edit = "0.25.15"
jsonc-parser = { version = "0.34", features = ["cst", "serde"] }
tempfile = "3.27.0"

[dev-dependencies]
reqwest = { version = "0.13.5", features = ["blocking", "json", "rustls"] }
rmcp = { version = "3.5.0", features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest"] }
tokio = { version = "1.53.1", features = ["full"] }
